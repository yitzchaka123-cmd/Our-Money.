<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>אין חיבור · המזומן שלנו</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #ffffff;
        color: #1a1a1a;
        font-family: 'Assistant', 'Noto Sans Hebrew', system-ui, -apple-system, sans-serif;
        padding: 0 24px;
        text-align: center;
      }
      img { width: 72px; height: 72px; border-radius: 16px; }
      h1 { font-size: 22px; margin: 18px 0 8px; }
      p { color: #5c5c5c; margin: 0 0 20px; line-height: 1.5; }
      button {
        font: inherit;
        font-weight: 700;
        color: #fff;
        background: #5b6bf5;
        border: 0;
        border-radius: 999px;
        padding: 12px 28px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>אין חיבור לאינטרנט</h1>
      <p>המספרים מוצגים רק כשהם עדכניים. אפשר עדיין לרשום הוצאה בבוט בטלגרם — היא תישמר כשיחזור החיבור.</p>
      <button type="button" onclick="location.reload()">לנסות שוב</button>
    </main>
  </body>
</html>
